<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Conveyors API</title>
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1c2230; --dim: #6b6a66; --line: #e2e0da; --accent: #d9601a; --get: #2f7d4a; --post: #b4531a; --chip: #ecebe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --panel: #1e2128; --ink: #ece9e2; --dim: #9a978f; --line: #2c3039; --accent: #ff8a3d; --get: #6fcf8e; --post: #ffa25e; --chip: #2a2e37; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 16px; z-index: 1; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  input[type=search] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 8px 16px 40px; }
  section { margin-top: 22px; }
  h2 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h2 .from { font-weight: normal; color: var(--dim); font-size: 13px; }
  .ep { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; }
  .line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 42px; }
  .m.GET { color: var(--get); } .m.POST { color: var(--post); }
  .p { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .h { color: var(--dim); margin-top: 3px; overflow-wrap: anywhere; }
  .none { color: var(--dim); margin-top: 30px; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 2px; }
  .home { display: inline-block; font-size: 13px; color: var(--accent); text-decoration: none; margin-bottom: 4px; }
  .home:hover { text-decoration: underline; }
  .ep { scroll-margin-top: var(--head, 180px); }
  .ep.has { cursor: pointer; }
  .ep.has:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .ep .tw { margin-left: auto; color: var(--dim); font-size: 12px; transition: transform .15s; }
  .ep.open .tw { transform: rotate(90deg); }
  .w { font: 600 11px ui-monospace, monospace; color: var(--post); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
  .d { display: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; cursor: auto; }
  .ep.open .d { display: block; }
  .d p { margin: 0 0 8px; }
  .d p.use { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
  .d h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .d table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .d td, .d th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .d th { color: var(--dim); font-weight: 600; font-size: 12px; }
  .d td:first-child { white-space: nowrap; }
  .d .tbl { overflow-x: auto; }
  .d pre { margin: 0; background: var(--chip); border-radius: 6px; padding: 9px 11px; overflow: auto; max-height: 320px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .d code, .h code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); border-radius: 3px; padding: 0 4px; }
  .d ul { margin: 0; padding-left: 20px; } .d li { margin: 3px 0; }
  .tools { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; }
  .tools button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
  @media (max-width: 600px) { .d td:first-child { white-space: normal; } }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="./">← Quantum Conveyors</a>
  <h1>Quantum Conveyors API</h1>
  <div class="sub" id="sub"></div>
  <input type="search" id="q" placeholder="Search paths and descriptions (e.g. channel, group, flow)" autofocus>
  <div class="chips" id="chips"></div>
  <div class="tools"><button id="openall">Open all</button><button id="closeall">Close all</button></div>
</div></header>
<main><div class="wrap" id="list"></div></main>
<script>
const DATA = {"groups": [{"group": "Overview", "from": "Quantum Conveyors", "endpoints": [{"method": "GET", "path": "/quantum", "help": "Summary: channels, groups, inputs, outputs, capsules pending, auto group, the status line", "d": {"group": "Overview", "about": "A summary of the whole Quantum network: how many channels, groups, outputs and inputs there are, how many capsules are waiting at Quantum Inputs, whether Auto Group is on, and the one-line status the log shows.", "use": "A quick health check from a script or dashboard: is the mod running, how big is the network, are capsules piling up (`pending`).", "example": "GET /quantum", "answer": "{\"ok\": true, \"channels\": 12, \"groups\": 3, \"outputs\": 18, \"inputs\": 22, \"pending\": 4, \"autoGroup\": true,\n \"status\": \"Quantum networks: 12, 18 output(s), 22 input(s), 4 pending\"}\n", "notes": ["`outputs` are the station-end adapters that put capsules on a belt; `inputs` take capsules off a belt's end.", "`pending` is capsules waiting at Quantum Inputs for a channel with room."]}}, {"method": "GET", "path": "/quantum/flow", "help": "Per channel: capsules moved in the last minutes (up to 10), and the receivers that placed none", "d": {"group": "Overview", "about": "Per channel: how many capsules it moved in the last few minutes, its outputs and inputs, and the receiving adapters that placed nothing in that time (with \"(no belt)\" when one has no belt attached).", "use": "Find a stalled line: a channel with `moved: 0`, or receivers in `idleReceivers`, usually means a full or missing belt at the far end, or nothing feeding it.", "params": [["minutes", "number", "5", "How far back to look, from 0.1 up to 10 minutes"]], "example": "GET /quantum/flow?minutes=5", "answer": "{\"ok\": true, \"minutes\": 5, \"channels\": [\n  {\"id\": \"channel-1\", \"name\": \"Iron > Line > 2\", \"moved\": 340, \"outputs\": 1, \"inputs\": 2, \"idleReceivers\": []},\n  {\"id\": \"channel-4\", \"name\": \"Copper\", \"moved\": 0, \"outputs\": 1, \"inputs\": 1, \"idleReceivers\": [\"45012 (no belt)\"]}]}\n"}}]}, {"group": "Channels", "from": "Quantum Conveyors", "endpoints": [{"method": "GET", "path": "/quantum/channels", "help": "Every channel: id, name, short name, group (id and path), outputs, inputs", "d": {"group": "Channels", "about": "Every channel: its id, its full name (with its groups, \"Iron > Line > 2\"), its short name, the group it's in (id and path), and how many outputs and inputs are on it.", "use": "The list behind any tool that shows or changes channels, and the `channel` ids every channel and adapter change needs.", "example": "GET /quantum/channels", "answer": "{\"ok\": true, \"channels\": [\n  {\"id\": \"channel-1\", \"name\": \"Iron > Line > 2\", \"short\": \"2\", \"group\": \"g3\", \"groupPath\": \"Iron > Line\", \"outputs\": 1, \"inputs\": 2},\n  {\"id\": \"channel-2\", \"name\": \"Spare\", \"short\": \"Spare\", \"group\": null, \"groupPath\": \"\", \"outputs\": 0, \"inputs\": 0}]}\n"}}, {"method": "POST", "path": "/quantum/channels/create", "help": "A new channel; without group= a build name like Iron-Line-2 is filed into its group (host only)", "d": {"group": "Channels", "about": "A new channel. With `group=` it's made inside that group and named `name`. Without `group=`, a build-style name such as `Iron-Line-2` is filed into its groups (Iron > Line, as \"2\"), the same as Auto Group does; any other name is just the channel's name.", "use": "Setting up a base from a script: make a channel per production line, then put adapters on it with `/quantum/adapters/modify`.", "params": [["name", "text", "", "The channel's name, or a build name to file into groups"], ["group", "group id", "", "Make it inside this group (as `/quantum/groups` lists it)"]], "example": "POST /quantum/channels/create?name=Iron-Line-2", "answer": "{\"ok\": true, \"channel\": \"channel-7\", \"name\": \"Iron > Line > 2\", \"group\": \"g3\"}\n", "errors": ["`only the host can create channels`, or `no group … , or not the host`: run it on the host's game."]}}, {"method": "POST", "path": "/quantum/channels/modify", "help": "name= renames; group= moves it into a group (group= empty: out of every group) (host only)", "d": {"group": "Channels", "about": "Rename a channel (`name=`), move it into a group (`group=`), or both. `group=` empty takes it out of every group.", "use": "Tidying a network from a script: rename channels after a rebuild, or file them into groups.", "params": [["channel", "channel id", "", "The channel (required)"], ["name", "text", "", "Its new name"], ["group", "group id", "", "Move it into this group; empty: out of every group"]], "example": "POST /quantum/channels/modify?channel=channel-2&name=Spare%20iron&group=g1", "answer": "{\"ok\": true, \"reason\": null}\n", "errors": ["`channel= is required`", "`give name= to rename, or group= to move it`", "`ok: false` when the channel or group doesn't exist, or this isn't the host."]}}, {"method": "POST", "path": "/quantum/channels/remove", "help": "Delete a channel (host only)", "d": {"group": "Channels", "about": "Delete a channel. Its adapters are left without a channel.", "use": "Cleaning up channels nothing uses any more (`outputs` and `inputs` both 0 in `/quantum/channels`).", "params": [["channel", "channel id", "", "The channel to delete"]], "example": "POST /quantum/channels/remove?channel=channel-2", "answer": "{\"ok\": true, \"reason\": null}\n"}}]}, {"group": "Adapters", "from": "Quantum Conveyors", "endpoints": [{"method": "GET", "path": "/quantum/adapters", "help": "Every adapter: id, kind, role, position, channel (id and name), attached to a belt", "d": {"group": "Adapters", "about": "Every Quantum adapter: its structure id, building kind, role (an output at the station end, or an input at the machine end), position, its channel (id and name), and whether it's attached to a belt.", "use": "Finding adapters that aren't on a channel or aren't attached to a belt, or the `id` to put one on a channel.", "example": "GET /quantum/adapters", "answer": "{\"ok\": true, \"adapters\": [\n  {\"id\": 45010, \"kind\": 812, \"role\": \"out (station end)\", \"pos\": [12.4, 1992.1, -5.2], \"channel\": \"channel-1\", \"channelName\": \"Iron > Line > 2\", \"attached\": true},\n  {\"id\": 45012, \"kind\": 811, \"role\": \"in (machine end)\", \"pos\": [40.1, 1991.8, 3.7], \"channel\": null, \"channelName\": null, \"attached\": false}]}\n", "notes": ["`id` is the adapter's structure id, the same id other building tools use.", "`attached` is always true for outputs."]}}, {"method": "POST", "path": "/quantum/adapters/modify", "help": "Put an adapter on a channel; channel= empty takes it off (host only)", "d": {"group": "Adapters", "about": "Put an adapter on a channel, or take it off one with `channel=` empty: the same as Assign and Unassign in the adapter's menu.", "use": "Wiring a base from a script: after building the adapters, put each on its line's channel.", "params": [["id", "structure id", "", "The adapter (required)"], ["channel", "channel id", "", "The channel to put it on (required); empty takes it off"]], "example": "POST /quantum/adapters/modify?id=45012&channel=channel-1", "answer": "{\"ok\": true, \"reason\": null, \"channel\": \"channel-1\"}\n", "errors": ["`id= is required (an adapter's structure id)`", "`channel= is required (empty takes the adapter off its channel)`"]}}]}, {"group": "Groups", "from": "Quantum Conveyors", "endpoints": [{"method": "GET", "path": "/quantum/groups", "help": "Every group: id, name, parent, path, channels and adapters in it", "d": {"group": "Groups", "about": "Every group (folder): its id, name, parent, full path, and how many channels and adapters are inside it, counting its sub-groups.", "use": "Showing the menu's folder tree in a tool, or finding the `group` id for a channel or group change.", "example": "GET /quantum/groups", "answer": "{\"ok\": true, \"groups\": [\n  {\"id\": \"g1\", \"name\": \"Iron\", \"parent\": null, \"path\": \"Iron\", \"channels\": 3, \"adapters\": 7},\n  {\"id\": \"g3\", \"name\": \"Line\", \"parent\": \"g1\", \"path\": \"Iron > Line\", \"channels\": 2, \"adapters\": 4}]}\n"}}, {"method": "POST", "path": "/quantum/groups/create", "help": "A new group (parent= empty or left out: top level) (host only)", "d": {"group": "Groups", "about": "A new group, at the top level or inside `parent`.", "use": "Building a folder layout from a script before filing channels into it.", "params": [["name", "text", "", "The group's name (required)"], ["parent", "group id", "", "Make it inside this group; empty or left out: top level"]], "example": "POST /quantum/groups/create?name=Copper", "answer": "{\"ok\": true, \"group\": \"g4\", \"path\": \"Copper\"}\n", "errors": ["`name= is required`", "`couldn't create it (no such parent, or not the host)`"]}}, {"method": "POST", "path": "/quantum/groups/modify", "help": "name= renames; parent= moves it (empty: top level) (host only)", "d": {"group": "Groups", "about": "Rename a group (`name=`), move it under another group (`parent=`), or both. `parent=` empty moves it to the top level.", "use": "Reorganising the folder tree from a script.", "params": [["group", "group id", "", "The group (required)"], ["name", "text", "", "Its new name"], ["parent", "group id", "", "Move it inside this group; empty: top level"]], "example": "POST /quantum/groups/modify?group=g3&parent=", "answer": "{\"ok\": true, \"reason\": null}\n", "errors": ["`group= is required`", "`give name= to rename, or parent= to move it`"]}}, {"method": "POST", "path": "/quantum/groups/remove", "help": "Delete a group; its channels and groups move up a level (host only)", "d": {"group": "Groups", "about": "Delete a group. Its channels and sub-groups move up a level; no channel is deleted.", "use": "Flattening a folder you no longer need.", "params": [["group", "group id", "", "The group to delete"]], "example": "POST /quantum/groups/remove?group=g3", "answer": "{\"ok\": true, \"reason\": null}\n"}}, {"method": "POST", "path": "/quantum/groups/convert", "help": "File every ungrouped build-named channel into groups (host only)", "d": {"group": "Groups", "about": "Files every channel that's outside a group and has a build-style name (such as `Iron-Line-2`) into its groups, as Auto Group would have if it had been on when they were made. Answers how many were filed.", "use": "A one-off tidy-up of an older base whose channels were made before Auto Group.", "example": "POST /quantum/groups/convert", "answer": "{\"ok\": true, \"filed\": 9}\n"}}]}], "note": "served under /quantum/ by a mod that passes HTTP requests on to plugins, such as LunarLink (127.0.0.1:8765)"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let group = null;
function hi(text, words) {
  let out = esc(text);
  for (const w of words) if (w) out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  return out;
}
// a little Markdown: `code` and **bold**
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const open = new Set();
function rows(list) {
  return `<div class="tbl"><table><tr><th>Name</th><th>Type</th><th>Default</th><th>Meaning</th></tr>` +
    list.map(([n, t, d, m]) => `<tr><td><code>${esc(n)}</code></td><td>${esc(t)}</td><td>${esc(d || "-")}</td><td>${md(m)}</td></tr>`).join("") + `</table></div>`;
}
function detail(e) {
  const d = e.d; let h = `<div class="d"><p>${md(d.about || e.help)}</p>`;
  if (d.use) h += `<h4>What it's for</h4><p class="use">${md(d.use)}</p>`;
  if (d.params && d.params.length) h += `<h4>Parameters</h4>` + rows(d.params);
  if (d.body && d.body.length) h += `<h4>Body (JSON)</h4>` + rows(d.body);
  if (d.example) h += `<h4>Example</h4><pre>${esc(d.example.trimEnd())}</pre>`;
  if (d.answer) h += `<h4>Answer</h4><pre>${esc(d.answer.trimEnd())}</pre>`;
  if (d.errors && d.errors.length) h += `<h4>Errors</h4><ul>${d.errors.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
  if (d.notes && d.notes.length) h += `<h4>Notes</h4><ul>${d.notes.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
  return h + `</div>`;
}
const text = e => [e.method, e.path, e.help, e.d && e.d.about, e.d && e.d.use, e.d && (e.d.notes || []).join(" "), e.d && (e.d.params || []).map(p => p.join(" ")).join(" ")].join(" ").toLowerCase();
function render() {
  const words = document.getElementById("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, html = "";
  for (const g of DATA.groups) {
    if (group && g.group !== group) continue;
    const eps = g.endpoints.filter(e => words.every(w => (text(e) + " " + g.group.toLowerCase()).includes(w)));
    if (!eps.length) continue;
    shown += eps.length;
    html += `<section><h2>${esc(g.group)} <span class="from">${esc(g.from)}</span></h2>` + eps.map(e => {
      const key = e.method + " " + e.path, has = !!e.d;
      return `<div class="ep${has ? " has" : ""}${open.has(key) ? " open" : ""}" data-k="${esc(key)}" id="${esc(e.path.replace(/\//g, "-").replace(/^-/, "") || "root")}">` +
        `<div class="line"><span class="m ${esc(e.method)}">${esc(e.method)}</span><span class="p">${hi(e.path, words)}</span>` +
        (e.method === "POST" && e.d && !/changes nothing/.test(e.help) ? `<span class="w" title="Changes the game: needs allow-writes">writes</span>` : "") +
        (has ? `<span class="tw">▸</span>` : "") + `</div>` +
        (e.help ? `<div class="h">${hi(e.help, words)}</div>` : "") + (has ? detail(e) : "") + `</div>`;
    }).join("") + `</section>`;
  }
  document.getElementById("list").innerHTML = html || `<div class="none">Nothing matches.</div>`;
  const total = DATA.groups.reduce((n, g) => n + g.endpoints.length, 0);
  document.getElementById("sub").textContent = `${shown} of ${total} endpoints` + (DATA.note ? " · " + DATA.note : "");
}
function chips() {
  const names = [null, ...new Set(DATA.groups.map(g => g.group))];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  for (const n of names) {
    const b = document.createElement("button");
    b.className = "chip" + (n === group ? " on" : ""); b.textContent = n ?? "All";
    b.onclick = () => { group = n; chips(); render(); };
    box.appendChild(b);
  }
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("list").addEventListener("click", ev => {
  if (ev.target.closest(".d")) return;                      // selecting text in the details doesn't close them
  const ep = ev.target.closest(".ep.has"); if (!ep) return;
  const k = ep.dataset.k; open.has(k) ? open.delete(k) : open.add(k); ep.classList.toggle("open");
});
const all = on => { for (const g of DATA.groups) for (const e of g.endpoints) if (e.d) on ? open.add(e.method + " " + e.path) : open.delete(e.method + " " + e.path); render(); };
document.getElementById("openall").onclick = () => all(true);
document.getElementById("closeall").onclick = () => all(false);
// a link to #structures-remove opens that endpoint
if (location.hash) {
  for (const g of DATA.groups) for (const e of g.endpoints) if ("#" + e.path.replace(/\//g, "-").replace(/^-/, "") === location.hash) open.add(e.method + " " + e.path);
}
chips(); render();
// the browser jumps to the #anchor itself; each endpoint's scroll-margin keeps it below the sticky header
const setMargin = () => document.documentElement.style.setProperty("--head", document.querySelector("header").offsetHeight + 8 + "px");
setMargin(); addEventListener("resize", setMargin);
if (location.hash) { const el = document.querySelector(location.hash.replace(/[^#\w-]/g, "")); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
