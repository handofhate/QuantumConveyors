name: Build and publish Quantum Conveyors

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build, for example 1.1.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    # The plugin references Moon Sweepers' generated IL2CPP assemblies, so this
    # must run on the Windows PC that has the game and BepInEx build staging.
    runs-on: [self-hosted, windows, x64, moonsweepers]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MOONSWEEPERS_GAME_ROOT: ${{ vars.MOONSWEEPERS_GAME_ROOT }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            $version = '${{ github.event.release.tag_name }}'
          } else {
            $version = '${{ inputs.version }}'
          }
          $version = $version.Trim() -replace '^[vV]', ''
          if ($version -notmatch '^\d+(\.\d+){1,2}$') {
            throw "Version '$version' is not a simple dotted version such as 1.1.2."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure the local .NET SDK
        shell: pwsh
        run: |
          $dotnet = 'C:\Users\Ty\.codex\dotnet-sdk'
          if (-not (Test-Path (Join-Path $dotnet 'dotnet.exe'))) {
            throw "The expected local .NET SDK was not found at $dotnet."
          }
          "DOTNET_ROOT=$dotnet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $dotnet | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the Nexus archive
        id: package
        shell: pwsh
        run: |
          .\tools\Package-QuantumConveyors.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist') `
            -MoonSweepersGameRoot $env:MOONSWEEPERS_GAME_ROOT

      - name: Read this release's changelog
        id: changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $all = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $pattern = '(?ms)^Version\s+' + [regex]::Escape($version) + '\s*\r?\n(?<body>.*?)(?=^Version\s+\d|\z)'
          $match = [regex]::Match($all, $pattern)
          if (-not $match.Success) {
            throw "No changelog section was found for version $version."
          }
          $body = $match.Groups['body'].Value.Trim()
          "text<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach the archive to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuantumConveyors-${{ steps.version.outputs.version }}.zip
          body: ${{ steps.changelog.outputs.text }}

      - name: Upload the release to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: dist/QuantumConveyors-${{ steps.version.outputs.version }}.zip
          version: ${{ steps.version.outputs.version }}
          display_name: Quantum Conveyors ${{ steps.version.outputs.version }}
          update_mod_version: true
