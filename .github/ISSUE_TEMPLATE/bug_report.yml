name: Bug report
description: Something in Quantum Conveyors doesn't work as it should
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them.
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Capsules don't move on a channel
        - A Quantum Input or Output
        - The E menu (channels, groups, drag and drop)
        - Auto Group
        - Indicator lights
        - Crew games (host / crew-mates)
        - Performance (fps with many adapters)
        - Hot loading with LunarLink
        - HTTP requests (/quantum/)
        - The game crashed or froze
        - Something else
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How it's installed
      options:
        - BepInEx/plugins/ (normal)
        - BepInEx/hot/ with LunarLink
        - Through a mod manager (Vortex or similar)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The lines from `BepInEx/LogOutput.log` that mention Quantum Conveyors (the start line says the version and how many adapters). For more detail turn on `Diagnostics` in `BepInEx/config/tylerun.moonsweepers.quantumconveyors.cfg`, make it happen again, and paste those lines. How many adapters and channels your base has helps too."
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Quantum Conveyors (the log's start line), BepInEx, MoonFramework, and the game."
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The other plugins you have installed.
